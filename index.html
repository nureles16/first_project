<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Plans Layout Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Pricing Plans</h1>
    <div class="pricing-container">
      <div class="pricing-card basic-plan">
        <h2>Basic</h2>
        <p>$9/month</p>
        <ul>
          <li>1 project</li>
          <li>5 GB storage</li>
          <li>Email support</li>
        </ul>
        <button>Choose Basic</button>
      </div>

      <div class="pricing-card pro-plan">
        <span class="badge">Most popular</span>
        <h2>Pro</h2>
        <p>$19/month</p>
        <ul>
          <li>10 projects</li>
          <li>50 GB storage</li>
          <li>Priority support</li>
        </ul>
        <button>Choose Pro</button>
      </div>

      <div class="pricing-card premium-plan">
        <h2>Premium</h2>
        <p>$29/month</p>
        <ul>
          <li>Unlimited projects</li>
          <li>1 TB storage</li>
          <li>24/7 phone support</li>
        </ul>
        <button>Choose Premium</button>
      </div>
    </div>
  </body>
</html>
